spring.application.name=autopark

# Подключение к MySQL (пароль лежит в отдельном файле, он не попадает в Git)
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/autopark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Moscow
spring.datasource.username=autopark_user

# Hibernate сам создаст и обновит таблицы по сущностям
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true