<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактирование машины</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px">
    <h1 class="mb-4">Редактирование машины</h1>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/cars/edit/{id}(id=${car.id})}" th:object="${car}" method="post">
                <div class="mb-3">
                    <label class="form-label">Марка авто</label>
                    <input type="text" th:field="*{markaAvto}" class="form-control"
                           th:classappend="${#fields.hasErrors('markaAvto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{markaAvto}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Год выпуска</label>
                    <input type="number" th:field="*{yearOfIssue}" class="form-control"
                           th:classappend="${#fields.hasErrors('yearOfIssue')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{yearOfIssue}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Дата постановки на учёт</label>
                    <input type="date" th:field="*{registrationDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('registrationDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{registrationDate}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">ФИО владельца</label>
                    <input type="text" th:field="*{ownerName}" class="form-control"
                           th:classappend="${#fields.hasErrors('ownerName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ownerName}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a th:href="@{/cars}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
