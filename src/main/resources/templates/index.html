<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Автопарк</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">Автопарк</h1>

    <!-- Форма добавления -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Добавить машину</h5>
            <form th:action="@{/cars/add}" th:object="${car}" method="post" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Марка авто</label>
                    <input type="text" th:field="*{markaAvto}" class="form-control"
                           th:classappend="${#fields.hasErrors('markaAvto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{markaAvto}"></div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Год выпуска</label>
                    <input type="number" th:field="*{yearOfIssue}" class="form-control"
                           th:classappend="${#fields.hasErrors('yearOfIssue')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{yearOfIssue}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Дата постановки на учёт</label>
                    <input type="date" th:field="*{registrationDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('registrationDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{registrationDate}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">ФИО владельца</label>
                    <input type="text" th:field="*{ownerName}" class="form-control"
                           th:classappend="${#fields.hasErrors('ownerName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{ownerName}"></div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Таблица -->
    <!-- Поиск, сортировка, счётчик -->
    <form th:action="@{/cars}" method="get" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="q" th:value="${q}" class="form-control"
                   placeholder="Поиск по марке, году или ФИО">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Найти</button>
        </div>
        <div class="col-auto">
            <button type="submit" name="sort" value="year" class="btn btn-outline-secondary">
                Сортировать по году выпуска
            </button>
        </div>
        <div class="col-auto">
            <a th:href="@{/cars}" class="btn btn-outline-dark">Сбросить</a>
        </div>
    </form>

    <div class="mb-2">
        Записей в таблице: <span class="badge bg-secondary" th:text="${count}">0</span>
        <span th:if="${sort == 'year'}" class="text-muted ms-2">
            (по году выпуска ↑, записи с пустой маркой скрыты)
        </span>
    </div>
    <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Марка авто</th>
            <th>Год выпуска</th>
            <th>Дата постановки на учёт</th>
            <th>ФИО владельца</th>
            <th style="width: 200px">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cars}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.markaAvto}"></td>
            <td th:text="${c.yearOfIssue}"></td>
            <td th:text="${#temporals.format(c.registrationDate, 'dd.MM.yyyy')}"></td>
            <td th:text="${c.ownerName}"></td>
            <td>
                <a th:href="@{/cars/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Изменить</a>
                <form th:action="@{/cars/delete/{id}(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Удалить машину?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Удалить</button>
                </form>
            </td>
            <tr th:if="${#lists.isEmpty(cars)}">
                <td colspan="6" class="text-center text-muted">Записей не найдено</td>
            </tr>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
